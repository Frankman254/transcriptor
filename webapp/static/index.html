<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriptor local</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #5b8cff; --accent2: #38d39f;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, input[type=text] {
    width: 100%; padding: 10px 12px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 9px; color: var(--text);
    font-size: 14px;
  }
  input[type=file] { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--border);
         background: var(--panel2); cursor: pointer; font-size: 14px; color: var(--muted); }
  .tab.active { border-color: var(--accent); color: var(--text); background: #202634; }
  button.go {
    margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: not-allowed; }
  .badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px;
           background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .badge b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--accent2); margin-right: 5px; }
  .progress-outer { height: 10px; background: var(--panel2); border-radius: 999px;
                    overflow: hidden; border: 1px solid var(--border); }
  .progress-inner { height: 100%; width: 0%; background: linear-gradient(90deg,var(--accent),var(--accent2));
                    transition: width .3s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px;
                    color: var(--muted); margin: 8px 2px 0; }
  .stage { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .stage .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .segments { max-height: 420px; overflow-y: auto; margin-top: 6px; }
  .seg { display: flex; gap: 12px; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  .seg:last-child { border-bottom: none; }
  .seg .t { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px;
            white-space: nowrap; padding-top: 1px; min-width: 168px; }
  .seg .x { flex: 1; }
  .downloads { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .downloads a { text-decoration: none; padding: 8px 14px; border-radius: 9px;
                 background: var(--panel2); border: 1px solid var(--border); color: var(--text);
                 font-size: 13px; }
  .downloads a:hover { border-color: var(--accent); }
  .downloads a b { display: block; font-size: 11px; color: var(--muted);
                   font-weight: 400; max-width: 220px; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .stem-player { width: 100%; margin-top: 10px; padding: 10px 12px;
                 border-radius: 9px; background: var(--panel2); border: 1px solid var(--border); }
  .stem-player label { display: block; margin-bottom: 7px; color: var(--text); }
  .stem-player audio { display: block; width: 100%; height: 36px; }
  .err { color: var(--danger); font-size: 14px; }
  .hidden { display: none; }
  cite { color: var(--muted); font-style: normal; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ Transcriptor local</h1>
  <p class="sub">Whisper corriendo en tu máquina · progreso en vivo · cada frase con su tiempo</p>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-src="url" onclick="setSource('url')">🔗 YouTube</div>
      <div class="tab" data-src="file" onclick="setSource('file')">📁 Archivo</div>
    </div>

    <div id="pane-url">
      <label>Link de YouTube</label>
      <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    <div id="pane-file" class="hidden">
      <label>Audio o video (mp3, m4a, wav, mp4…)</label>
      <input type="file" id="file" accept="audio/*,video/*">
    </div>

    <div id="mode-pane" style="margin-top:16px">
      <label>¿Qué quieres hacer?</label>
      <div class="tabs">
        <div class="tab active" data-mode="transcribe" onclick="setMode('transcribe')">🎧 Transcribir</div>
        <div class="tab" data-mode="lyrics" onclick="setMode('lyrics')">🎤 Letra de canción</div>
        <div class="tab" data-mode="audio_only" onclick="setMode('audio_only')">⬇️ Solo audio</div>
      </div>
      <p class="sub hidden" id="mode-hint" style="margin:8px 2px 0;font-size:12px"></p>
    </div>

    <div class="row" id="opts" style="margin-top:16px">
      <div>
        <label>Modelo</label>
        <select id="model"></select>
      </div>
      <div>
        <label>Idioma</label>
        <select id="language"></select>
      </div>
    </div>

    <div id="audio-opts" style="margin-top:16px">
      <div class="row">
        <div>
          <label>Formato de audio</label>
          <select id="audio_format" onchange="onFormatChange()"></select>
        </div>
        <div id="quality-wrap">
          <label>Calidad</label>
          <select id="audio_quality"></select>
        </div>
      </div>
      <p class="sub" id="fmt-hint" style="margin:8px 2px 0;font-size:12px"></p>
    </div>

    <div id="separator-opts" class="hidden" style="margin-top:16px">
      <label>Calidad de separación vocal</label>
      <select id="separation_quality" onchange="onSeparationChange()"></select>
      <p class="sub" id="separation-hint" style="margin:8px 2px 0;font-size:12px"></p>
    </div>

    <button class="go" id="go" onclick="start()">Transcribir</button>
  </div>

  <div class="card hidden" id="live">
    <div class="badges" id="badges"></div>
    <div class="stage" id="stage"></div>
    <div class="progress-outer"><div class="progress-inner" id="bar"></div></div>
    <div class="progress-label"><span id="pct">0%</span><span id="clock"></span></div>
    <div id="err" class="err"></div>
    <div class="downloads hidden" id="downloads"></div>
    <div class="segments" id="segments"></div>
  </div>
</div>

<script>
let SOURCE = "url";
let MODE = "transcribe";
let INFO = null;

function setSource(s) {
  SOURCE = s;
  document.querySelectorAll(".tab[data-src]").forEach(t =>
    t.classList.toggle("active", t.dataset.src === s));
  document.getElementById("pane-url").classList.toggle("hidden", s !== "url");
  document.getElementById("pane-file").classList.toggle("hidden", s !== "file");
  syncAudioOpts();
}

// El formato de audio solo aplica cuando bajamos de YouTube. En "letra de
// canción" el backend usa siempre el original (separa mejor la voz).
function syncAudioOpts() {
  document.getElementById("audio-opts").classList.toggle(
    "hidden", SOURCE !== "url" || MODE === "lyrics");
  document.getElementById("separator-opts").classList.toggle(
    "hidden", MODE !== "lyrics");
}

function onFormatChange() {
  const sel = document.getElementById("audio_format");
  const spec = (INFO?.audio_formats || []).find(f => f.value === sel.value);
  // Los formatos sin pérdida no tienen bitrate que elegir.
  document.getElementById("quality-wrap").classList.toggle(
    "hidden", !spec || spec.lossless);
  document.getElementById("fmt-hint").textContent = spec ? spec.hint : "";
}

function onSeparationChange() {
  const value = document.getElementById("separation_quality").value;
  const spec = (INFO?.separation_profiles || []).find(p => p.value === value);
  document.getElementById("separation-hint").textContent = spec ? spec.hint : "";
}

function setMode(m) {
  MODE = m;
  document.querySelectorAll(".tab[data-mode]").forEach(t =>
    t.classList.toggle("active", t.dataset.mode === m));
  // En "solo audio" no hacen falta modelo ni idioma; en letra sí (usa Whisper).
  document.getElementById("opts").classList.toggle("hidden", m === "audio_only");
  document.getElementById("go").textContent =
    m === "audio_only" ? "Descargar audio" :
    m === "lyrics" ? "Sacar letra" : "Transcribir";
  const hints = {
    lyrics: "🎤 Aísla la voz con el motor elegido y luego la transcribe. " +
            "BS-RoFormer recupera mejor las voces débiles; Demucs es más rápido.",
  };
  const hint = document.getElementById("mode-hint");
  hint.textContent = hints[m] || "";
  hint.classList.toggle("hidden", !hints[m]);
  syncAudioOpts();
}

// Qué mostrar a la derecha de la barra en las etapas que no son transcripción.
const STAGE_LABELS = {
  downloading: "descargando",
  downloading_separator_model: "descargando modelo de separación",
  separating: "aislando la voz",
  postprocessing: "convirtiendo",
};

// Cómo presentar cada archivo del resultado. El orden manda en la fila.
const FILE_KINDS = [
  ["audio", "⬇️", "Audio"],
  ["vocals", "🎤", "Voz aislada"],
  ["instrumental", "🎹", "Instrumental sin voz"],
  ["txt", "📄", "Texto plano"],
  ["srt", "🎬", "Subtítulos SRT"],
  ["vtt", "🌐", "Subtítulos VTT"],
  ["tsv", "📊", "Tabla TSV"],
  ["json", "{ }", "JSON con tiempos"],
  ["lyrixa", "🎵", "Abrir en Lyrixa / Proyecto Lyrixa"],
];

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// Igual que fmt pero con milisegundos (importante para sincronizar letras).
function fmtMs(sec) {
  sec = Math.max(0, sec || 0);
  const whole = Math.floor(sec);
  const ms = Math.floor((sec - whole) * 1000);
  return fmt(whole) + "." + String(ms).padStart(3, "0");
}

async function loadInfo() {
  INFO = await (await fetch("/api/info")).json();
  const ms = document.getElementById("model");
  INFO.models.forEach(m => {
    const o = document.createElement("option");
    o.value = m.name;
    o.textContent = m.name + (m.cached ? "  ✓ descargado" : "  ⬇ requiere descarga");
    if (m.name === "medium") o.selected = true;
    ms.appendChild(o);
  });
  const ls = document.getElementById("language");
  INFO.languages.forEach(l => {
    const o = document.createElement("option");
    o.value = l.value; o.textContent = l.label;
    ls.appendChild(o);
  });
  const fs = document.getElementById("audio_format");
  INFO.audio_formats.forEach(f => {
    const o = document.createElement("option");
    o.value = f.value; o.textContent = f.label;
    if (f.value === "mp3") o.selected = true;   // el más compatible
    fs.appendChild(o);
  });
  const qs = document.getElementById("audio_quality");
  INFO.audio_qualities.forEach(q => {
    const o = document.createElement("option");
    o.value = q; o.textContent = q.replace("K", " kbps");
    if (q === "192K") o.selected = true;
    qs.appendChild(o);
  });
  const ss = document.getElementById("separation_quality");
  INFO.separation_profiles.forEach(p => {
    const o = document.createElement("option");
    o.value = p.value;
    o.textContent = p.label + (p.available ? "" : " — no instalado");
    o.disabled = !p.available;
    if (p.value === "precise" && p.available) o.selected = true;
    ss.appendChild(o);
  });
  if (!ss.value || ss.selectedOptions[0]?.disabled) {
    const fallback = INFO.separation_profiles.find(p => p.available);
    if (fallback) ss.value = fallback.value;
  }
  onSeparationChange();
  onFormatChange();
  syncAudioOpts();
}

async function start() {
  const model = document.getElementById("model").value;
  const language = document.getElementById("language").value;
  const fd = new FormData();
  fd.append("source_type", SOURCE);
  fd.append("model", model);
  fd.append("language", language);
  fd.append("mode", MODE);
  fd.append("audio_format", document.getElementById("audio_format").value);
  fd.append("audio_quality", document.getElementById("audio_quality").value);
  fd.append("separation_quality", document.getElementById("separation_quality").value);

  if (MODE === "audio_only") {
    // Solo audio funciona con un link de YouTube.
    const url = document.getElementById("url").value.trim();
    if (!url) return alert("Pega un link de YouTube para descargar el audio");
    fd.append("url", url);
  } else if (SOURCE === "url") {
    const url = document.getElementById("url").value.trim();
    if (!url) return alert("Pega un link de YouTube");
    fd.append("url", url);
  } else {
    const f = document.getElementById("file").files[0];
    if (!f) return alert("Elige un archivo");
    fd.append("file", f);
  }

  document.getElementById("go").disabled = true;
  const live = document.getElementById("live");
  live.classList.remove("hidden");
  document.getElementById("segments").innerHTML = "";
  document.getElementById("downloads").classList.add("hidden");
  document.getElementById("downloads").innerHTML = "";
  document.getElementById("err").textContent = "";
  setBadges({ model: MODE === "audio_only" ? null : model, device: INFO.device });
  setStage("Iniciando…", true);
  setProgress(0);

  const res = await fetch("/api/jobs", { method: "POST", body: fd });
  const { job_id } = await res.json();
  localStorage.setItem("job_id", job_id);  // para retomar si se recarga la pestaña
  listen(job_id);
}

function setBadges({ model, device, title, duration }) {
  const b = document.getElementById("badges");
  let html = model
    ? `<span class="badge"><span class="dot"></span>Modelo <b>${model}</b></span>`
    : "";
  html += `<span class="badge">Dispositivo <b>${device}</b></span>`;
  if (title) html += `<span class="badge" title="${title}">🎬 <b>${title.slice(0, 40)}</b></span>`;
  if (duration) html += `<span class="badge">Duración <b>${fmt(duration)}</b></span>`;
  b.innerHTML = html;
}

function setStage(text, spinning) {
  document.getElementById("stage").innerHTML =
    (spinning ? '<span class="spin">⏳</span> ' : "") + text;
}
function setProgress(p) {
  const pct = p == null ? null : Math.round(p * 100);
  document.getElementById("bar").style.width = (pct == null ? 3 : pct) + "%";
  document.getElementById("pct").textContent = pct == null ? "…" : pct + "%";
}

function finishJob() {
  // Trabajo terminado (bien o mal): dejamos de retomarlo al recargar.
  localStorage.removeItem("job_id");
  document.getElementById("go").disabled = false;
}

function listen(jobId) {
  // EventSource se reconecta solo tras un corte (dormir la Mac, WiFi, etc.) y,
  // gracias a los `id:` del servidor, retoma justo donde se quedó, sin duplicar.
  const es = new EventSource(`/api/jobs/${jobId}/events`);
  let duration = 0;
  let tries = 0;

  es.addEventListener("open", () => { tries = 0; });  // reconectó bien

  es.addEventListener("status", e => {
    const d = JSON.parse(e.data);
    setStage(d.message || d.stage, true);
    if (d.model) setBadges({ model: d.model, device: d.device, duration: d.duration });
  });
  es.addEventListener("meta", e => {
    const d = JSON.parse(e.data);
    duration = d.duration;
    setBadges({ model: d.model, device: d.device, title: d.title, duration: d.duration });
  });
  // Avance de las etapas largas que no son Whisper (descarga, Demucs, conversión).
  es.addEventListener("progress", e => {
    const d = JSON.parse(e.data);
    setProgress(d.progress);
    document.getElementById("clock").textContent = STAGE_LABELS[d.stage] || "";
  });
  es.addEventListener("segment", e => {
    const d = JSON.parse(e.data);
    if (d.progress != null) setProgress(d.progress);
    document.getElementById("clock").textContent =
      `${fmt(d.end)}${duration ? " / " + fmt(duration) : ""}`;
    const row = document.createElement("div");
    row.className = "seg";
    row.innerHTML = `<span class="t">${fmtMs(d.start)} → ${fmtMs(d.end)}</span>` +
                    `<span class="x"></span>`;
    row.querySelector(".x").textContent = d.text;
    const box = document.getElementById("segments");
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  });
  es.addEventListener("done", e => {
    const d = JSON.parse(e.data);
    setStage("✅ Listo — " + (d.title || ""), false);
    setProgress(1);
    document.getElementById("clock").textContent = "";
    const dl = document.getElementById("downloads");
    dl.classList.remove("hidden");
    dl.innerHTML = "<span class='badge'>Descargar:</span>";
    for (const [kind, icon, label] of FILE_KINDS) {
      const descriptor = d.files[kind];
      if (!descriptor) continue;
      const name = typeof descriptor === "string" ? descriptor : descriptor.name;
      const url = typeof descriptor === "string"
        ? `/download/${d.job_id}/${encodeURIComponent(name)}`
        : descriptor.url;
      const a = document.createElement("a");
      a.href = url;
      a.download = name;          // el navegador conserva el nombre del título
      a.title = name;
      if (kind === "lyrixa") {
        a.title = "En Lyrixa: More → Import project (.lyrixa.json). " +
                  "Después carga el mismo audio para revisar la sincronización.";
      }
      const ext = name.includes(".") ? name.split(".").pop() : "";
      a.textContent = `${icon} ${label}` + (kind === "audio" ? ` (.${ext})` : "");
      const small = document.createElement("b");   // el nombre real, debajo
      small.textContent = name;
      a.appendChild(small);
      dl.appendChild(a);
      if (kind === "vocals" || kind === "instrumental") {
        const player = document.createElement("div");
        player.className = "stem-player";
        const playerLabel = document.createElement("label");
        playerLabel.textContent = `${icon} Escuchar ${label.toLowerCase()}`;
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = url;
        player.append(playerLabel, audio);
        dl.appendChild(player);
      }
    }
    es.close();
    finishJob();
  });
  es.addEventListener("error", e => {
    if (e.data) {
      // Error real de la app (p. ej. yt-dlp/whisper falló).
      let msg = "Ocurrió un error.";
      try { msg = JSON.parse(e.data).message; } catch (_) {}
      document.getElementById("err").textContent = "⚠️ " + msg;
      setStage("Error", false);
      es.close();
      finishJob();
      return;
    }
    // Sin datos = se cayó la conexión. EventSource reintenta solo.
    tries++;
    if (tries > 6) {
      document.getElementById("err").textContent =
        "⚠️ No se pudo reconectar. El trabajo pudo terminar o el servidor se cerró.";
      setStage("Sin conexión", false);
      es.close();
      finishJob();
      return;
    }
    setStage("🔌 Conexión perdida, reintentando… (la transcripción sigue en el servidor)", true);
  });
}

// Al cargar: si había un trabajo en curso (p. ej. la Mac se durmió y recargaste),
// lo retomamos automáticamente mientras el servidor siga vivo.
function resumeIfAny() {
  const jobId = localStorage.getItem("job_id");
  if (!jobId) return;
  document.getElementById("live").classList.remove("hidden");
  document.getElementById("segments").innerHTML = "";
  document.getElementById("downloads").classList.add("hidden");
  document.getElementById("err").textContent = "";
  document.getElementById("go").disabled = true;
  setStage("Retomando el trabajo en curso…", true);
  setProgress(0);
  listen(jobId);
}

loadInfo();
resumeIfAny();
</script>
</body>
</html>
